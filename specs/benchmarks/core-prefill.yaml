apiVersion: groundupscale.dev/v1alpha1
kind: BenchmarkCase
metadata:
  name: core-prefill
  version: 0.1.0
spec:
  cases:
    # Put the repeatedly unstable layer_1 QK exact probe first so its timing
    # contract does not inherit sustained-load state from earlier MatMuls.
    - {id: matmul-layer1-qk, scope: model/two-layer-transformer/transformer/layer_1/attention/qk_matmul, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: matmul-layer0-gate-proj, scope: model/two-layer-transformer/transformer/layer_0/mlp/gate_proj, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: matmul-layer0-qk, scope: model/two-layer-transformer/transformer/layer_0/attention/qk_matmul, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: matmul-layer1-gate-proj, scope: model/two-layer-transformer/transformer/layer_1/mlp/gate_proj, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: matmul-layer0-context, scope: model/two-layer-transformer/transformer/layer_0/attention/context_matmul, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: matmul-q-proj, scope: model/two-layer-transformer/transformer/layer_0/attention/q_proj, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: rmsnorm-input, scope: model/two-layer-transformer/transformer/layer_0/input_norm, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: softmax-attention, scope: model/two-layer-transformer/transformer/layer_0/attention/softmax, mode: operator, warmup_iterations: 500, samples: 20}
    - {id: transformer-layer, scope: model/two-layer-transformer/transformer/layer_0, mode: module, warmup_iterations: 50, samples: 20}
    - {id: two-layer-prefill, scope: workload/transformer-prefill/request/model-prefill, mode: e2e, warmup_iterations: 20, samples: 20}
