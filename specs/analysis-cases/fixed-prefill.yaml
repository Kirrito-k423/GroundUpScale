apiVersion: groundupscale.dev/v1alpha1
kind: AnalysisCase
metadata:
  name: fixed-prefill
  version: 0.1.0
spec:
  shape:
    kind: fixed
    bindings: {B: 1, S: 512, H: 512, NH: 8, D: 64, I: 2048}
    dtype: float32
  driver:
    kind: fixed_iterations
    warmup_iterations: 10
    measured_iterations: 20
  observation_window: {kind: iterations, value: 20}
