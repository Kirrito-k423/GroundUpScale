name: Compiler CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.14
          uv sync --locked --group dev

      - name: Run deterministic tests
        run: uv run pytest -q

      - name: Compile twice and compare canonical artifacts
        run: |
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          uv run groundupscale compile specs/plans/mac-cpu-prefill.yaml --repository-root . --output "$first" --json
          uv run groundupscale compile specs/plans/mac-cpu-prefill.yaml --repository-root . --output "$second" --json
          diff -ru "$first" "$second"
